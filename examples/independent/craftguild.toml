schema_version = 1
standards_version = "0.1.0"
[[artifacts]]
id = "backend"
command = "backend-demo"
project = "backend-demo"
kind = "rust"
manifest = "backend/Cargo.toml"
lockfile = "backend/Cargo.lock"
package = "backend-demo"
inputs = ["backend/assets/banner.txt"]
[[artifacts]]
id = "frontend"
command = "independent-ui"
project = "independent-ui"
kind = "frontend"
manifest = "frontend/package.json"
lockfile = "frontend/package-lock.json"
package = "example-ui"
target = "browser"
input_dirs = ["frontend/src"]
[artifacts.bundle]
root = "frontend"
lockfile = "frontend/package-lock.json"
metafile = "frontend/metafile.json"
directory = "frontend/dist"
command = ["npm", "--prefix", "frontend", "run", "build"]

[[sources]]
pattern = "backend/src/**"
role = "implementation"
reason = "Sample application owns its grammar"
[[sources]]
pattern = "backend/build.rs"
role = "implementation"
reason = "Application build identity and SBOM embedding"
[[adapters]]
language = "rust"
test = ["cargo", "test", "--locked", "--release", "--manifest-path", "backend/Cargo.toml"]
format = ["cargo", "fmt", "--manifest-path", "backend/Cargo.toml", "--check"]
lint = ["cargo", "clippy", "--locked", "--release", "--manifest-path", "backend/Cargo.toml", "--", "-D", "warnings"]

[[sources]]
pattern = "frontend/src/**"
role = "implementation"
reason = "Shipped frontend source"
[[adapters]]
language = "npm"
test = ["npm", "--prefix", "frontend", "test"]
lint = ["npm", "--prefix", "frontend", "run", "lint"]
typecheck = ["npm", "--prefix", "frontend", "run", "typecheck"]

[[sources]]
pattern = "Makefile"
role = "implementation"
reason = "Canonical sample development entries"
[[sources]]
pattern = "scripts/*.py"
role = "implementation"
reason = "Sample installation and actual-host acceptance"
[[sources]]
pattern = "backend/tests/**"
role = "test"
reason = "Offline process conformance tests"
[[sources]]
pattern = "frontend/tests/**"
role = "test"
reason = "Frontend dependency behavior tests"
