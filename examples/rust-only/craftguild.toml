schema_version = 1
standards_version = "0.1.0"
[[releases]]
id = "sample"
initial_version = "0.1.0"
tag_prefix = "v"
notes = "docs/releases"
paths = ["src", "build.rs", "Cargo.toml", "Cargo.lock", "assets", "craftguild.toml"]
[[releases.cargo]]
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
packages = ["example-rust"]
[[artifacts]]
id = "backend"
command = "sample"
project = "sample"
kind = "rust"
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
package = "example-rust"
inputs = ["assets/banner.txt"]

[[sources]]
pattern = "src/**"
role = "implementation"
reason = "Sample application owns its grammar"
[[sources]]
pattern = "build.rs"
role = "implementation"
reason = "Application build identity and SBOM embedding"
[[adapters]]
language = "rust"
test = ["cargo", "test", "--locked", "--release", "--manifest-path", "Cargo.toml"]
format = ["cargo", "fmt", "--manifest-path", "Cargo.toml", "--check"]
lint = ["cargo", "clippy", "--locked", "--release", "--manifest-path", "Cargo.toml", "--", "-D", "warnings"]

[[sources]]
pattern = "Makefile"
role = "implementation"
reason = "Canonical sample development entries"
[[sources]]
pattern = "scripts/*.py"
role = "implementation"
reason = "Sample installation and actual-host acceptance"
[[sources]]
pattern = "tests/**"
role = "test"
reason = "Offline process conformance tests"
