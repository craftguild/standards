schema_version = 1
standards_version = "0.1.0"

[[policies]]
kind = "publication"
repository = "craftguild/standards"
manifest = "Cargo.toml"
npm_lockfiles = ["package-lock.json", "examples/embedded-web/web/package-lock.json", "examples/independent/frontend/package-lock.json"]

[[artifacts]]
id = "standards"
command = "craftguild-standards"
project = "standards"
kind = "rust"
manifest = "Cargo.toml"
lockfile = "Cargo.lock"
package = "craftguild-standards"
supplemental = "assets/supplemental.json"
inputs = ["assets/banner.txt", "Makefile", "adapters/npm-tests.cjs", "conformance/contracts.json"]
input_dirs = ["assets/fonts", "schemas"]

[[sources]]
pattern = "crates/*/src/**"
role = "implementation"
reason = "Runtime libraries, build preparation and quality tooling"

[[sources]]
pattern = "crates/*/build.rs"
role = "implementation"
reason = "Cargo build-script adapter"

[[sources]]
pattern = "conformance/git_fixture.rs"
role = "test"
reason = "Isolated OpenPGP test identity shared by Rust integration tests"

[[sources]]
pattern = "crates/*/tests/**"
role = "test"
reason = "Integration tests run only by Cargo test"

[[sources]]
pattern = "scripts/*.py"
role = "implementation"
reason = "Build, install and repository verification tools"

[[sources]]
pattern = "scripts/tests/**"
role = "test"
reason = "Python verification of repository build/install scripts"

[[sources]]
pattern = "Makefile"
role = "implementation"
reason = "Canonical development command wiring"

[[sources]]
pattern = ".github/workflows/**"
role = "implementation"
reason = "Platform and consumer MSRV verification orchestration"

[[adapters]]
language = "rust"
test = ["cargo", "test", "--locked", "--workspace", "--no-default-features", "--features", "bootstrap"]
format = ["cargo", "fmt", "--all", "--check"]
lint = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--no-default-features", "--features", "bootstrap", "--", "-D", "warnings"]

[[sources]]
pattern = "adapters/*.cjs"
role = "implementation"
reason = "Language parser adapters embedded in the standards tool"

[[sources]]
pattern = "adapters/tests/**"
role = "test"
reason = "Behavioral adapter tests executed by node:test"

[[sources]]
pattern = "examples/**/src/**"
role = "implementation"
reason = "Standalone sample implementations, including frontend code"

[[sources]]
pattern = "examples/**/build.rs"
role = "implementation"
reason = "Sample application build integration"

[[sources]]
pattern = "examples/**/scripts/*.py"
role = "implementation"
reason = "Sample install and acceptance entry points"

[[sources]]
pattern = "examples/**/Makefile"
role = "implementation"
reason = "Sample development entry points"

[[sources]]
pattern = "examples/**/tests/**"
role = "test"
reason = "Frontend behavior tests"

[[adapters]]
language = "npm"
test = ["npm", "test"]
lint = ["npm", "run", "lint"]
typecheck = ["npm", "run", "typecheck"]

[[commands]]
id = "documents-and-provenance"
purpose = "Check public document links and exact vendored schema/font inputs"
argv = ["python3", "scripts/check_docs.py"]
phase = "check"

[[commands]]
id = "repository-script-tests"
purpose = "Verify target-aware install without building or using live paths"
argv = ["python3", "-m", "unittest", "discover", "-s", "scripts/tests"]
phase = "test"

[[commands]]
id = "offline-binary-and-install"
purpose = "Isolated actual-host binary presentation, exact SBOM and staged install"
argv = ["python3", "scripts/acceptance.py"]
phase = "acceptance"
